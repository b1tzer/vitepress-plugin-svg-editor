<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="'Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color: #2563eb"/>
      <stop offset="100%" style="stop-color: #7c3aed"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="400" height="200" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- 标题 -->
  <text x="200" y="44" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">最小示例 — VitePress SVG Editor</text>
  <!-- 方块 1 -->
  <rect x="60" y="80" width="80" height="50" rx="6" fill="url(#g1)"/>
  <text x="100" y="110" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">VitePress</text>
  <!-- 箭头 -->
  <line x1="148" y1="105" x2="192" y2="105" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="192,101 198,105 192,109" fill="#94a3b8"/>
  <!-- 方块 2 -->
  <rect x="206" y="80" width="80" height="50" rx="6" fill="url(#g1)"/>
  <text x="246" y="110" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">SVG Editor</text>
  <!-- 结果 -->
  <text x="200" y="175" text-anchor="middle" font-size="11" fill="#64748b">🎉 拖拽方块试试！</text>
</svg>
