name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ═══════════════════ 单元测试 + 组件测试 + 集成测试 ═══════════════════
  unit-and-component:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm test:unit

  # ═══════════════════ E2E 测试（Chromium + Firefox） ═══════════════════
  e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vitepress: ['1.0.0', '1.3.0', '1.6.0']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm --dir examples/basic add -D vitepress@${{ matrix.vitepress }}
      - run: npx playwright install --with-deps chromium firefox
      - run: pnpm test

  # ═══════════════════ Build + Preview 验证 ═══════════════════
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm build
      - run: npx playwright install --with-deps chromium firefox
      - run: pnpm test -- --project=build-preview-chromium --project=build-preview-firefox