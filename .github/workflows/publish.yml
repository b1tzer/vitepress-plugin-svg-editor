name: Publish to npm

# 触发时机：
#   1. push v* tag 时——与「手动 bump 版本 → 更新 CHANGELOG → 打 tag → 推送」的发布流程衔接（方案 A，对齐 unplugin/vitepress 生态惯例）
#   2. 手动触发（workflow_dispatch）——便于本地验证 OIDC 配置是否正确
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 发布所需权限：
#   - contents: write —— 创建 GitHub Release 需要写权限（比 npm 发布的 read 更宽）
#   - id-token: write —— 让 GitHub 向 npmjs 签发 OIDC token（方案 A 核心，无需 NPM_TOKEN secret）
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 防呆校验：push tag 触发时，强制 tag 版本号与 package.json 的 version 一致，
      # 避免「tag 是 v0.3.0 但 version 还是 0.2.0」导致 npm publish 报 403（重复发布）
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag 版本 v${TAG_VERSION} 与 package.json 版本 ${PKG_VERSION} 不一致，请先 bump 版本后再打 tag"
            exit 1
          fi
          echo "版本校验通过：v${TAG_VERSION}"

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          # OIDC Trusted Publishing 要求 npm CLI >= 11.5.1；Node 24.x 自带 npm 11.x 满足要求
          node-version: '24'
          cache: 'pnpm'
          # 必须显式指向官方源：OIDC Trusted Publishing 目前仅支持 registry.npmjs.org
          registry-url: 'https://registry.npmjs.org'

      # 依赖安装（根目录为 pnpm workspace，故用 pnpm）
      - run: pnpm install --frozen-lockfile

      # 发布前构建：package.json 的 files 白名单包含 dist，必须先产出构建产物
      - run: pnpm build

      # 双保险：确保 npm CLI >= 11.5.1（OIDC 认证硬性要求，否则会报误导性的 404）
      - run: npm install -g npm@latest

      # 使用 npm publish（而非 pnpm publish）：
      #   - OIDC 认证依赖 npm CLI 的能力（需 >= 11.5.1）
      #   - --provenance 生成 SLSA 来源证明，是 OIDC 方案的标准形态
      - run: npm publish --provenance --access public

      # 从 CHANGELOG.md 提取当前版本章节，作为 GitHub Release 的 release notes。
      # 仅 push tag 时执行（workflow_dispatch 手动触发时无 tag，跳过）。
      - name: Extract changelog notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 提取「## vX.Y.Z 」到下一个「## v」之间的内容（不含标题行本身）
          awk -v ver="## v${VERSION} " '
            index($0, ver) == 1 { found=1; next }
            found && /^## v/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          # 兜底：若未提取到内容，写入默认说明，避免 gh release 因空 notes 报错
          if [ ! -s /tmp/release-notes.md ]; then
            echo "请参考 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)" > /tmp/release-notes.md
          fi
          echo "release notes 字节数：$(wc -c < /tmp/release-notes.md)"

      # 创建 GitHub Release（与 npm 发包解耦：npm 发布成功后才宣告发布）。
      # 使用内置 gh CLI（GITHUB_TOKEN 自动认证），notes 来自上一步从 CHANGELOG 提取的内容。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md
